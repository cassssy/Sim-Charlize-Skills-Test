<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">A List of Food Recipes</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="fried-chicken.html">Fried Chicken</a></li>
          <li class="nav-item"><a class="nav-link" href="spaghetti.html">Spaghetti</a></li>
          <li class="nav-item"><a class="nav-link" href="pancakes.html">Pancakes</a></li>
          <li class="nav-item"><a class="nav-link" href="lasagna.html">Lasagna</a></li>
          <li class="nav-item"><a class="nav-link active" href="form.html">Feedback</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1>Site Feedback</h1>
        <p class="text-muted">Tell us what you think about these recipes.</p>

        <form id="feedback-form" class="card shadow-sm border-0 p-4">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject">
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message <span class="text-danger">*</span></label>
            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
          </div>

          <div id="form-message" class="mb-3" role="status" aria-live="polite"></div>

          <button type="submit" class="btn btn-danger">Submit</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4">
    <div class="container text-center">
      <p class="mb-0">A List of Food Recipes</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById("feedback-form");
    const messageBox = document.getElementById("form-message");

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
    }

    function isValidMessage(value) {
      return value.trim().length >= 10;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;
      const emailValid = isValidEmail(email);
      const messageValid = isValidMessage(message);

      messageBox.className = "mb-3 alert";

      if (emailValid && messageValid) {
        form.reset();
        messageBox.classList.add("alert-success");
        messageBox.textContent = "Success!";
      } else {
        messageBox.classList.add("alert-danger");
        messageBox.textContent = "Error: please enter a valid email and message.";
      }
    });
  </script>
</body>
</html>
